<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script src="src/device-gate.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>AOS — Autonomous Orbital Sentinel</title>
    <meta name="description" content="AOS watches the orbital network: satellites, links, ground stations and the hazards that break them.">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%23000'/%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%23fff' stroke-width='6'/%3E%3Cellipse cx='50' cy='50' rx='46' ry='17' fill='none' stroke='%23fff' stroke-width='4' transform='rotate(-28 50 50)'/%3E%3C/svg%3E">
    <link rel="preload" href="assets/fonts/AOSConsole-Black.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/AOSConsole-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/AOSConsole-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/stage.css">
    <link rel="stylesheet" href="styles/interface.css">
    <link rel="stylesheet" href="styles/loader.css">
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <main class="stage" data-stage aria-label="AOS operations deck">
      <div class="stage__frame">
        <img class="stage__still" data-still alt="">
        <video class="stage__ambient" data-ambient muted playsinline loop preload="auto" disablepictureinpicture disableremoteplayback></video>
        <video class="stage__clip" data-clip muted playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>
        <div class="hotspots" data-hotspots></div>
      </div>
      <div class="stage__shade" aria-hidden="true"></div>
    </main>

    <header class="masthead">
      <button class="wordmark" type="button" data-wordmark>
        <svg class="wordmark__orbit" viewBox="0 0 100 50" aria-hidden="true" focusable="false">
          <g transform="rotate(-24 50 25)">
            <path d="M 6 25 a 44 16 0 1 0 88 0 a 44 16 0 1 0 -88 0" />
          </g>
        </svg>
        <span class="wordmark__text">AOS</span>
        <span class="wordmark__sat" data-beacon aria-hidden="true"></span>
      </button>
      <div class="updates-mount" data-updates aria-live="polite"></div>
      <div class="ambient-mount" data-ambient-mount></div>
    </header>

    <nav class="rail" aria-label="Stops">
      <ol class="rail__list" data-rail></ol>
    </nav>

    <p class="hint" data-hint aria-hidden="true"><span class="hint__line"></span>Scroll to board the deck</p>

    <div class="loader" data-loader role="progressbar" aria-label="Loading the deck" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <p class="loader__mark">AOS</p>
      <span class="loader__track"><span class="loader__fill" data-loader-fill></span></span>
      <p class="loader__status" data-loader-status>Loading the deck</p>
    </div>

    <noscript><p class="noscript">AOS needs JavaScript to run the deck.</p></noscript>
  </body>
</html>
